<div class="contact-form">
<div>
    <h2>Let's talk.</h2>
    <p>Available for freelance projects and technical consulting.</p>
</div>
<form id="contact-form" action="https://formspree.io/f/mnjqvwkl" method="POST">
    <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>
    <div class="form-group">
        <label>Message</label>
        <textarea name="message" rows="5" required></textarea>
    </div>
    <button type="submit" id="submit-btn" class="cv-btn" style="width:100%; border:none; cursor:pointer;">
        Send Message
    </button>
    <p id="form-status" style="margin-top: 15px; font-weight: 600; text-align: center;"></p>
</form>
</div>
